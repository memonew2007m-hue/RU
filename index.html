<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع رتاج</title>
    <!-- استدعاء خط عربي مميز ورقعة/ديواني للمخطوطة -->
    <link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            height: 100%;
            width: 100%;
            font-family: 'Cairo', sans-serif;
            overflow: hidden;
        }

        /* خلفية الموقع باستخدام الصورة المرفقة */
        .background-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* استبدل '1000106204.jpg' بمسار صورة الخلفية لديك */
            background-image: url('1000106204.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        /* طبقة شفافة ناعمة لزيادة التباين */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 10, 30, 0.25);
            z-index: 1;
        }

        /* محتوى الموقع */
        .content {
            position: relative;
            z-index: 2;
            text-align: center;
            user-select: none;
        }

        /* حاوية المخطوطة الكلية */
        .calligraphy-title {
            font-family: 'Aref Ruqaa', serif;
            font-size: 8rem;
            display: flex;
            direction: rtl;
            justify-content: center;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            filter: drop-shadow(0 8px 15px rgba(0, 0, 0, 0.4));
        }

        /* نمط الأحرف الافتراضي (تدرج الأزرق والسماوي) */
        .char {
            display: inline-block;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            background: linear-gradient(180deg, #89CFF0 0%, #0077BE 50%, #002B5B 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            padding: 0 5px;
        }

        /* تحويم الماوس لزيادة البروز بشكل خفيف */
        .char:hover {
            transform: translateY(-8px) scale(1.05);
        }

        /* التنسيق عند النقر على الحرف (ذهبي مشع وبروز عالي) */
        .char.active {
            background: linear-gradient(180deg, #FFF7AD 0%, #FFAA00 50%, #B37400 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            transform: translateY(-20px) scale(1.25);
            filter: drop-shadow(0 0 20px #FFD700) 
                    drop-shadow(0 0 35px rgba(255, 215, 0, 0.8)) 
                    drop-shadow(0 0 50px rgba(255, 170, 0, 0.6));
            animation: pulseGlow 1.5s infinite alternate;
        }

        /* تأثير نبض وإشعاع للون الذهبي */
        @keyframes pulseGlow {
            0% {
                filter: drop-shadow(0 0 15px #FFD700) 
                        drop-shadow(0 0 30px rgba(255, 215, 0, 0.8));
            }
            100% {
                filter: drop-shadow(0 0 25px #FFD700) 
                        drop-shadow(0 0 45px rgba(255, 215, 0, 1)) 
                        drop-shadow(0 0 60px rgba(255, 170, 0, 0.8));
            }
        }

        /* نص توضيحي في الأسفل */
        .subtitle {
            margin-top: 30px;
            color: #E0F2FE;
            font-size: 1.2rem;
            letter-spacing: 1px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.6);
            opacity: 0.9;
        }

        /* التجاوب مع شاشات الهواتف */
        @media (max-width: 768px) {
            .calligraphy-title {
                font-size: 4.5rem;
                gap: 5px;
            }
            .subtitle {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>

    <div class="background-container">
        <div class="overlay"></div>
        <div class="content">
            <!-- المخطوطة مقسمة إلى حروف منفصلة -->
            <div class="calligraphy-title" id="titleContainer">
                <span class="char">ر</span>
                <span class="char">ت</span>
                <span class="char">ا</span>
                <span class="char">ج</span>
            </div>
            <p class="subtitle">اضغط على أي حرف ليتلون بالذهبي المشع</p>
        </div>
    </div>

    <script>
        // تحديد جميع الحروف
        const chars = document.querySelectorAll('.char');

        // إضافة حدث النقر على كل حرف
        chars.forEach(char => {
            char.addEventListener('click', () => {
                // إلغاء التفعيل عن باقي الحروف (ليكون الحرف المنقور عليه فقط هو المفعل)
                chars.forEach(c => {
                    if (c !== char) {
                        c.classList.remove('active');
                    }
                });

                // تبديل حالة التفعيل للحرف الضغوط عليه
                char.classList.toggle('active');
            });
        });
    </script>
</body>
</html>
